<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoRu - Sign In</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="landing-hero">
    <div class="auth-card-studio">
      <div class="text-center mb-4">
        <img src="/img/logo.png" alt="YoRu" style="width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(124, 58, 237, 0.5));" class="mb-3">
        <h4 class="fw-bold text-white mb-1">YoRu</h4>
        <span class="text-secondary small">Creative Image Transformation Platform</span>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Đăng nhập</button>
        <button class="auth-tab-btn" id="tabRegBtn" onclick="switchAuthTab('register')">Đăng ký mới</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label-studio">Địa chỉ Email</label>
          <input type="email" class="form-control-studio" id="loginEmail" placeholder="name@domain.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label-studio">Mật khẩu</label>
          <input type="password" class="form-control-studio" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-studio w-100" id="loginBtn">
          <span class="btn-text">Vào Studio</span>
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="d-none">
        <div class="mb-3">
          <label class="form-label-studio">Địa chỉ Email</label>
          <input type="email" class="form-control-studio" id="regEmail" placeholder="name@domain.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label-studio">Mật khẩu</label>
          <input type="password" class="form-control-studio" id="regPassword" placeholder="Tối thiểu 6 ký tự" required>
        </div>
        <div class="mb-4">
          <label class="form-label-studio">Xác nhận mật khẩu</label>
          <input type="password" class="form-control-studio" id="regConfirm" placeholder="Nhập lại mật khẩu" required>
        </div>
        <button type="submit" class="btn-studio w-100" id="regBtn">
          <span class="btn-text">Tạo tài khoản</span>
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>

      <!-- SEED-15: Content Bug - English footer on Vietnamese UI -->
      <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
        <span class="card-meta-text">© 2024 YoRu. All rights reserved.</span>
      </div>
    </div>
  </div>

  <div class="toast-container-custom" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (isLoggedIn()) {
      const user = getUser();
      window.location.href = user && user.role === 'admin' ? '/admin.html' : '/gallery.html';
    }

    function switchAuthTab(type) {
      const isLogin = type === 'login';
      document.getElementById('tabLoginBtn').classList.toggle('active', isLogin);
      document.getElementById('tabRegBtn').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').classList.toggle('d-none', !isLogin);
      document.getElementById('registerForm').classList.toggle('d-none', isLogin);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      setLoading(btn, true);
      try {
        const res = await apiCall('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        showToast('Đăng nhập thành công!', 'success');
        setTimeout(() => {
          window.location.href = res.data.user.role === 'admin' ? '/admin.html' : '/gallery.html';
        }, 400);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      if (pw !== confirm) {
        showToast('Mật khẩu xác nhận không khớp', 'error');
        return;
      }
      const btn = document.getElementById('regBtn');
      setLoading(btn, true);
      try {
        const res = await apiCall('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('regEmail').value,
            password: pw
          })
        });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        showToast('Đăng ký thành công!', 'success');
        setTimeout(() => { window.location.href = '/gallery.html'; }, 400);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    function setLoading(btn, loading) {
      const text = btn.querySelector('.btn-text');
      const spinner = btn.querySelector('.spinner-border');
      if (loading) {
        text.classList.add('d-none'); spinner.classList.remove('d-none'); btn.disabled = true;
      } else {
        text.classList.remove('d-none'); spinner.classList.add('d-none'); btn.disabled = false;
      }
    }
  </script>
</body>
</html>
