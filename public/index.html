<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoRu - Đăng nhập</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css?v=2.2" rel="stylesheet">
</head>
<body class="nb-body">
  <div class="landing-hero">
    <div class="nb-login-card">
            <div class="text-center mb-4">
        <div class="nb-badge mb-3">★ YORU STUDIO ★</div>
        <div class="d-flex align-items-center justify-content-center gap-3 mb-2">
          <div class="nb-logo-frame">
            <img src="/img/logo.png" alt="YoRu" class="nb-logo-img">
          </div>
          <h2 class="nb-title mb-0">YoRu</h2>
        </div>
        <p class="nb-subtitle">App xịn nhất thế giới từng được Schizo tạo ra</p>
      </div>

            <div class="nb-tab-wrap mb-4">
        <button class="nb-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Đăng nhập</button>
        <button class="nb-tab-btn" id="tabRegBtn" onclick="switchAuthTab('register')">Đăng ký mới</button>
      </div>

            <form id="loginForm">
        <div class="mb-3">
          <label class="nb-label">Địa chỉ Email</label>
          <input type="email" class="nb-input" id="loginEmail" placeholder="name@domain.com" required autocomplete="email" oninvalid="this.setCustomValidity(this.validity.valueMissing ? 'Vui lòng nhập địa chỉ email.' : 'Vui lòng nhập đúng định dạng email (cần có ký tự @).')" oninput="this.setCustomValidity('')">
        </div>
        <div class="mb-4">
          <label class="nb-label">Mật khẩu</label>
          <input type="password" class="nb-input" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" oninvalid="this.setCustomValidity('Vui lòng nhập mật khẩu.')" oninput="this.setCustomValidity('')">
        </div>
        <button type="submit" class="nb-btn nb-btn-primary w-100" id="loginBtn">
          <span class="btn-text">VÀO STUDIO <i class="bi bi-arrow-right-short fs-5"></i></span>
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>

            <form id="registerForm" class="d-none">
        <div class="mb-3">
          <label class="nb-label">Địa chỉ Email</label>
          <input type="email" class="nb-input" id="regEmail" placeholder="name@domain.com" required autocomplete="email" oninvalid="this.setCustomValidity(this.validity.valueMissing ? 'Vui lòng nhập địa chỉ email.' : 'Vui lòng nhập đúng định dạng email (cần có ký tự @).')" oninput="this.setCustomValidity('')">
        </div>
        <div class="mb-3">
          <label class="nb-label">Mật khẩu</label>
          <input type="password" class="nb-input" id="regPassword" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password" oninvalid="this.setCustomValidity('Vui lòng nhập mật khẩu.')" oninput="this.setCustomValidity('')">
        </div>
        <div class="mb-4">
          <label class="nb-label">Xác nhận mật khẩu</label>
          <input type="password" class="nb-input" id="regConfirm" placeholder="Nhập lại mật khẩu" required autocomplete="new-password" oninvalid="this.setCustomValidity('Vui lòng nhập lại mật khẩu xác nhận.')" oninput="this.setCustomValidity('')">
        </div>
        <button type="submit" class="nb-btn nb-btn-accent w-100" id="regBtn">
          <span class="btn-text">TẠO TÀI KHOẢN <i class="bi bi-check-lg fs-5"></i></span>
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>

      <div class="nb-footer-text">YoRu • Case study của NĐK</div>
    </div>
  </div>

  <div class="toast-container-custom" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (isLoggedIn()) {
      const user = getUser();
      window.location.href = user && user.role === 'admin' ? '/admin.html' : '/gallery.html';
    }

    function switchAuthTab(type) {
      const isLogin = type === 'login';
      document.getElementById('tabLoginBtn').classList.toggle('active', isLogin);
      document.getElementById('tabRegBtn').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').classList.toggle('d-none', !isLogin);
      document.getElementById('registerForm').classList.toggle('d-none', isLogin);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      setLoading(btn, true);
      try {
        const res = await apiCall('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        showToast('Đăng nhập thành công!', 'success');
        setTimeout(() => {
          window.location.href = res.data.user.role === 'admin' ? '/admin.html' : '/gallery.html';
        }, 300);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      if (pw !== confirm) {
        showToast('Mật khẩu xác nhận không khớp', 'error');
        return;
      }
      const btn = document.getElementById('regBtn');
      setLoading(btn, true);
      try {
        const res = await apiCall('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('regEmail').value,
            password: pw
          })
        });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        showToast('Đăng ký thành công!', 'success');
        setTimeout(() => { window.location.href = '/gallery.html'; }, 300);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    function setLoading(btn, loading) {
      const text = btn.querySelector('.btn-text');
      const spinner = btn.querySelector('.spinner-border');
      if (loading) {
        text.classList.add('d-none'); spinner.classList.remove('d-none'); btn.disabled = true;
      } else {
        text.classList.remove('d-none'); spinner.classList.add('d-none'); btn.disabled = false;
      }
    }
  </script>
</body>
</html>
