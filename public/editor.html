<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Editor - YoRu</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Pro Studio Header -->
  <header class="navbar-studio">
    <div class="px-3 d-flex justify-content-between align-items-center w-100">
      <div class="d-flex align-items-center gap-3">
        <a class="brand-wrap" href="/gallery.html">
          <img src="/img/logo.png" alt="YoRu" class="brand-logo-img">
          <span class="brand-name">YoRu</span>
        </a>
        <div class="nav-divider"></div>
        <a href="/gallery.html" class="nav-tab"><i class="bi bi-arrow-left"></i> Gallery</a>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="user-chip">
          <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
          <span class="user-chip-email" id="navUserEmail"></span>
        </div>
        <button class="nav-action-icon nav-action-danger" onclick="logout()" title="Log out">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Studio Main Work Area -->
  <main class="studio-layout">
    <!-- Center Image Canvas -->
    <section class="canvas-viewport" id="canvasViewport">
      <!-- Floating Control Pill -->
      <div class="canvas-control-pill">
        <button class="btn-pill-action" id="btnUndo" onclick="handleUndo()" disabled title="Undo last action (Ctrl+Z)">
          <i class="bi bi-arrow-counterclockwise"></i> Undo
        </button>
        <button class="btn-pill-action" id="btnReset" onclick="handleResetOriginal()" disabled title="Reset to original image">
          <i class="bi bi-arrow-repeat"></i> Reset
        </button>
        <div class="pill-divider"></div>
        <span class="canvas-live-badge" id="canvasMeta">0 × 0 px</span>
      </div>

      <!-- Image Canvas Viewport with Live Scale Wrapper -->
      <div class="image-canvas-wrapper" id="canvasWrapper">
        <div class="spinner-border text-info position-absolute d-none" id="loadingOverlay" role="status"></div>
        <img id="previewImage" src="" alt="Preview">

        <!-- Live Watermark Overlay -->
        <div class="watermark-overlay d-none" id="watermarkPreview"></div>

        <!-- Interactive Crop Overlay with 8 Handles -->
        <div class="crop-overlay-wrap d-none" id="cropOverlay">
          <div class="crop-box-interactive" id="cropBox">
            <div class="crop-handle handle-tl" data-handle="tl"></div>
            <div class="crop-handle handle-t"  data-handle="t"></div>
            <div class="crop-handle handle-tr" data-handle="tr"></div>
            <div class="crop-handle handle-r"  data-handle="r"></div>
            <div class="crop-handle handle-br" data-handle="br"></div>
            <div class="crop-handle handle-b"  data-handle="b"></div>
            <div class="crop-handle handle-bl" data-handle="bl"></div>
            <div class="crop-handle handle-l"  data-handle="l"></div>
            <div class="crop-dims-badge" id="cropDimsBadge">0 × 0 px</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Inspector Panel -->
    <aside class="inspector-panel">
      <div class="inspector-header">
        <div class="d-flex justify-content-between align-items-baseline">
          <h6 class="fw-bold text-white mb-0 text-truncate" id="imageName" style="max-width: 220px;">Filename</h6>
          <span class="canvas-live-badge" id="imageMeta"></span>
        </div>
      </div>

      <!-- Segmented Tool Navigation Bar -->
      <nav class="tool-nav-tabs">
        <button class="tool-tab-btn active" onclick="switchToolTab('resize')"><i class="bi bi-aspect-ratio"></i><span>Resize</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('crop')"><i class="bi bi-crop"></i><span>Crop</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('rotate')"><i class="bi bi-arrow-repeat"></i><span>Transform</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('filter')"><i class="bi bi-palette"></i><span>Filters</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('watermark')"><i class="bi bi-fonts"></i><span>Watermark</span></button>
        <button class="tool-tab-btn text-success" onclick="switchToolTab('export')"><i class="bi bi-download"></i><span>Export</span></button>
      </nav>

      <!-- Tool Panes -->
      <div class="tool-content-wrap">
        <!-- Pane 1: Resize -->
        <div class="tool-pane active" id="pane-resize">
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="control-label mb-0">Scale Preview</label>
              <span class="canvas-live-badge" id="scalePercentDisplay">100%</span>
            </div>
            <input type="range" class="form-range" id="resizeScaleRange" min="20" max="200" value="100" oninput="handleScaleSlider(this.value)">
            <div class="d-flex gap-1 mt-1">
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(0.25)">25%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(0.50)">50%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(0.75)">75%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(1.00)">100%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(1.50)">150%</button>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="control-label">Width (px)</label>
              <input type="number" class="control-input" id="resizeW" min="1">
            </div>
            <div class="col-6">
              <label class="control-label">Height (px)</label>
              <input type="number" class="control-input" id="resizeH" min="1">
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="keepRatio" checked>
            <label class="form-check-label text-secondary small" for="keepRatio">Lock Aspect Ratio</label>
          </div>

          <button class="btn-pro-primary w-100" onclick="handleResize()">
            <i class="bi bi-check2"></i> Apply Resize
          </button>
        </div>

        <!-- Pane 2: Crop (Interactive Mouse Drag) -->
        <div class="tool-pane" id="pane-crop">
          <div class="p-2 mb-3 rounded bg-info bg-opacity-10 border border-info border-opacity-25">
            <div class="d-flex align-items-center gap-2 text-info small fw-bold">
              <i class="bi bi-cursor-fill"></i>
              <span>Interactive Selection</span>
            </div>
            <small class="text-secondary d-block mt-1">Drag bounding box handles to crop, or drag inside to move.</small>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-3"><label class="control-label">X</label><input type="number" class="control-input" id="cropX" min="0" value="0" onchange="syncInputToCropBox()"></div>
            <div class="col-3"><label class="control-label">Y</label><input type="number" class="control-input" id="cropY" min="0" value="0" onchange="syncInputToCropBox()"></div>
            <div class="col-3"><label class="control-label">Width</label><input type="number" class="control-input" id="cropW" min="1" onchange="syncInputToCropBox()"></div>
            <div class="col-3"><label class="control-label">Height</label><input type="number" class="control-input" id="cropH" min="1" onchange="syncInputToCropBox()"></div>
          </div>

          <button class="btn-pro-primary w-100" onclick="handleCrop()">
            <i class="bi bi-crop"></i> Apply Crop
          </button>
        </div>

        <!-- Pane 3: Rotate & Flip -->
        <div class="tool-pane" id="pane-rotate">
          <label class="control-label">Rotate</label>
          <div class="d-flex gap-2 mb-4">
            <button class="btn-pro-secondary flex-fill" onclick="handleRotate(90)"><i class="bi bi-arrow-clockwise me-1"></i> 90°</button>
            <button class="btn-pro-secondary flex-fill" onclick="handleRotate(180)">180°</button>
            <button class="btn-pro-secondary flex-fill" onclick="handleRotate(270)">270°</button>
          </div>

          <label class="control-label">Flip Axis</label>
          <div class="d-flex gap-2">
            <button class="btn-pro-secondary flex-fill" onclick="handleFlip('horizontal')"><i class="bi bi-symmetry-horizontal me-1"></i> Flip Horizontal</button>
            <!-- SEED-12: Intentional visual bug - margin-top 15px -->
            <button class="btn-pro-secondary flex-fill" onclick="handleFlip('vertical')" style="margin-top: 15px;"><i class="bi bi-symmetry-vertical me-1"></i> Flip Vertical</button>
          </div>
        </div>

        <!-- Pane 4: Filter (With Visual Preset Thumbnails) -->
        <div class="tool-pane" id="pane-filter">
          <label class="control-label mb-2">Preset Filters</label>
          <div class="filter-card-grid">
            <div class="filter-preset-card" onclick="handleFilter('grayscale')">
              <div class="filter-sample-thumb grayscale-sample" id="thumbGrayscale"></div>
              <span class="small fw-semibold text-white">Grayscale</span>
            </div>
            <div class="filter-preset-card" onclick="handleFilter('sepia')">
              <div class="filter-sample-thumb sepia-sample" id="thumbSepia"></div>
              <span class="small fw-semibold text-white">Sepia</span>
            </div>
            <div class="filter-preset-card" onclick="handleFilter('blur')">
              <div class="filter-sample-thumb blur-sample" id="thumbBlur"></div>
              <span class="small fw-semibold text-white">Blur</span>
            </div>
          </div>
        </div>

        <!-- Pane 5: Watermark -->
        <div class="tool-pane" id="pane-watermark">
          <div class="mb-3">
            <label class="control-label">Watermark Text</label>
            <input type="text" class="control-input" id="wmText" placeholder="e.g. © YoRu">
          </div>
          <div class="row g-2 mb-3">
            <div class="col-12">
              <label class="control-label">Text Color</label>
              <div class="d-flex align-items-center gap-2 mb-2">
                <button type="button" class="color-swatch-btn" style="background:#ffffff;" onclick="setWmColor('#ffffff')"></button>
                <button type="button" class="color-swatch-btn" style="background:#06b6d4;" onclick="setWmColor('#06b6d4')"></button>
                <button type="button" class="color-swatch-btn" style="background:#a855f7;" onclick="setWmColor('#a855f7')"></button>
                <button type="button" class="color-swatch-btn" style="background:#f59e0b;" onclick="setWmColor('#f59e0b')"></button>
                <button type="button" class="color-swatch-btn" style="background:#10b981;" onclick="setWmColor('#10b981')"></button>
                <button type="button" class="color-swatch-btn" style="background:#ef4444;" onclick="setWmColor('#ef4444')"></button>
                <button type="button" class="color-swatch-btn" style="background:#090d16; border: 1px solid #475569;" onclick="setWmColor('#000000')"></button>
                <input type="color" class="color-picker-input ms-auto" id="wmColor" value="#ffffff" oninput="updateWatermarkPreview()">
              </div>
            </div>
            <div class="col-12">
              <label class="control-label">Placement</label>
              <select class="control-input" id="wmPosition">
                <option value="top-left">Top Left</option>
                <option value="top-right">Top Right</option>
                <option value="center">Center</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="bottom-right" selected>Bottom Right</option>
              </select>
            </div>
          </div>
          <button class="btn-pro-primary w-100" onclick="handleWatermark()">
            <i class="bi bi-shield-check"></i> Apply Watermark
          </button>
        </div>

        <!-- Pane 6: Export -->
        <div class="tool-pane" id="pane-export">
          <!-- SEED-10: export-section with absolute positioned btn-download overlapping on mobile -->
          <div class="export-section">
            <div class="mb-3">
              <label class="control-label">File Format</label>
              <select class="control-input" id="exportFormat">
                <option value="jpg">JPG (Optimized)</option>
                <option value="png">PNG (Lossless)</option>
                <option value="webp">WEBP (Modern Web)</option>
              </select>
            </div>
            <div class="mb-4">
              <div class="d-flex justify-content-between mb-1">
                <label class="control-label mb-0">Quality</label>
                <span class="canvas-live-badge" id="qualityVal">85%</span>
              </div>
              <input type="range" class="form-range" id="exportQuality" min="1" max="100" value="85" oninput="document.getElementById('qualityVal').textContent=this.value+'%'">
            </div>
            <button class="btn-pro-primary w-100 btn-download" style="background: var(--accent-success);" onclick="handleExport()">
              <i class="bi bi-download"></i> Download Image
            </button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div class="toast-container-custom" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
