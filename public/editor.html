<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoRu - Chỉnh sửa ảnh</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css?v=2.3" rel="stylesheet">
</head>
<body class="nb-body">
    <header class="navbar-studio">
    <div class="px-3 d-flex justify-content-between align-items-center w-100">
      <div class="d-flex align-items-center gap-3">
        <a class="brand-wrap" href="/gallery.html">
          <img src="/img/logo.png" alt="YoRu" class="brand-logo-img">
          <span class="brand-name">YoRu</span>
        </a>
        <div class="nav-divider"></div>
        <a href="/gallery.html" class="nav-tab"><i class="bi bi-arrow-left"></i> Bộ sưu tập</a>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="user-chip">
          <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
          <span class="user-chip-email" id="navUserEmail"></span>
        </div>
        <button class="nav-action-icon nav-action-danger" onclick="logout()" title="Đăng xuất">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </header>

    <main class="studio-layout">
        <section class="canvas-viewport" id="canvasViewport">
            <div class="canvas-control-pill">
        <button class="btn-pill-action" id="btnUndo" onclick="handleUndo()" disabled title="Hoàn tác (Ctrl+Z)">
          <i class="bi bi-arrow-counterclockwise"></i> Hoàn tác
        </button>
        <button class="btn-pill-action" id="btnReset" onclick="handleResetOriginal()" disabled title="Khôi phục ảnh gốc">
          <i class="bi bi-arrow-repeat"></i> Đặt lại
        </button>
        <div class="pill-divider"></div>
        <span class="canvas-live-badge" id="canvasMeta">0 × 0 px</span>
      </div>

            <div class="image-canvas-wrapper" id="canvasWrapper">
        <div class="spinner-border text-dark position-absolute d-none" id="loadingOverlay" role="status"></div>
        <img id="previewImage" src="" alt="Preview">

                <div class="watermark-overlay d-none" id="watermarkPreview"></div>

                <div class="crop-overlay-wrap d-none" id="cropOverlay">
          <div class="crop-box-interactive" id="cropBox">
            <div class="crop-handle handle-tl" data-handle="tl"></div>
            <div class="crop-handle handle-t"  data-handle="t"></div>
            <div class="crop-handle handle-tr" data-handle="tr"></div>
            <div class="crop-handle handle-r"  data-handle="r"></div>
            <div class="crop-handle handle-br" data-handle="br"></div>
            <div class="crop-handle handle-b"  data-handle="b"></div>
            <div class="crop-handle handle-bl" data-handle="bl"></div>
            <div class="crop-handle handle-l"  data-handle="l"></div>
            <div class="crop-dims-badge" id="cropDimsBadge">0 × 0 px</div>
          </div>
        </div>
      </div>
    </section>

        <aside class="inspector-panel">
      <div class="inspector-header">
        <div class="d-flex justify-content-between align-items-baseline">
          <h6 class="fw-bold mb-0 text-truncate text-dark" id="imageName" style="max-width: 200px;">Filename</h6>
          <span class="canvas-live-badge" id="imageMeta"></span>
        </div>
      </div>

            <nav class="tool-nav-tabs">
        <button class="tool-tab-btn active" onclick="switchToolTab('resize')"><i class="bi bi-aspect-ratio fs-5"></i><span>Resize</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('crop')"><i class="bi bi-crop fs-5"></i><span>Crop</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('rotate')"><i class="bi bi-arrow-repeat fs-5"></i><span>Transform</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('filter')"><i class="bi bi-palette fs-5"></i><span>Filters</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('watermark')"><i class="bi bi-fonts fs-5"></i><span>Watermark</span></button>
        <button class="tool-tab-btn" onclick="switchToolTab('export')"><i class="bi bi-download fs-5"></i><span>Export</span></button>
      </nav>

            <div class="tool-content-wrap">
                <div class="tool-pane active" id="pane-resize">
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label-pro mb-0">Scale Preview</label>
              <span class="canvas-live-badge" id="scalePercentDisplay">100%</span>
            </div>
            <input type="range" class="form-range form-range-pro" id="resizeScaleRange" min="20" max="200" value="100" oninput="handleScaleSlider(this.value)">
            <div class="d-flex gap-1 mt-2">
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(0.25)">25%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(0.50)">50%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(0.75)">75%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(1.00)">100%</button>
              <button type="button" class="btn-pro-secondary flex-fill py-1 px-1 small" onclick="applyScalePreset(1.50)">150%</button>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label-pro">Width (px)</label>
              <input type="number" class="form-input-pro" id="resizeW" min="1">
            </div>
            <div class="col-6">
              <label class="form-label-pro">Height (px)</label>
              <input type="number" class="form-input-pro" id="resizeH" min="1">
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="keepRatio" checked style="border: 2px solid #000;">
            <label class="form-check-label text-dark fw-bold small" for="keepRatio">Lock Aspect Ratio</label>
          </div>

          <button class="nb-btn nb-btn-primary w-100" onclick="handleResize()">
            <i class="bi bi-check2 me-1"></i> Apply Resize
          </button>
        </div>

                <div class="tool-pane" id="pane-crop">
          <div class="p-3 mb-3 rounded" style="background-color: var(--nb-yellow); border: 2px solid #000; box-shadow: 2px 2px 0 #000;">
            <div class="d-flex align-items-center gap-2 small fw-bold">
              <i class="bi bi-cursor-fill"></i>
              <span>Interactive Selection</span>
            </div>
            <small class="text-dark d-block mt-1 fw-semibold">Drag bounding handles to resize, or drag inside box to move.</small>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-6"><label class="form-label-pro">X (px)</label><input type="number" class="form-input-pro" id="cropX" min="0" value="0" onchange="syncInputToCropBox()"></div>
            <div class="col-6"><label class="form-label-pro">Y (px)</label><input type="number" class="form-input-pro" id="cropY" min="0" value="0" onchange="syncInputToCropBox()"></div>
            <div class="col-6"><label class="form-label-pro">Width (px)</label><input type="number" class="form-input-pro" id="cropW" min="1" onchange="syncInputToCropBox()"></div>
            <div class="col-6"><label class="form-label-pro">Height (px)</label><input type="number" class="form-input-pro" id="cropH" min="1" onchange="syncInputToCropBox()"></div>
          </div>

          <button class="nb-btn nb-btn-primary w-100" onclick="handleCrop()">
            <i class="bi bi-crop me-1"></i> Apply Crop
          </button>
        </div>

                <div class="tool-pane" id="pane-rotate">
          <label class="form-label-pro mb-2">Rotate</label>
          <div class="d-flex gap-2 mb-4">
            <button class="btn-pro-secondary flex-fill" onclick="handleRotate(90)"><i class="bi bi-arrow-clockwise me-1"></i> 90°</button>
            <button class="btn-pro-secondary flex-fill" onclick="handleRotate(180)">180°</button>
            <button class="btn-pro-secondary flex-fill" onclick="handleRotate(270)">270°</button>
          </div>

          <label class="form-label-pro mb-2">Flip Axis</label>
          <div class="d-flex gap-2 align-items-center">
            <button class="btn-pro-secondary flex-fill" onclick="handleFlip('horizontal')"><i class="bi bi-symmetry-horizontal me-1"></i> Flip Horizontal</button>
            <button class="btn-pro-secondary flex-fill" onclick="handleFlip('vertical')" style="margin-top: 15px;"><i class="bi bi-symmetry-vertical me-1"></i> Flip Vertical</button>
          </div>
        </div>

                <div class="tool-pane" id="pane-filter">
          <label class="form-label-pro mb-3">Color Filters</label>
          <div class="filter-grid-chips">
            <button class="btn-filter-chip" onclick="handleFilter('grayscale')">Grayscale</button>
            <button class="btn-filter-chip" onclick="handleFilter('sepia')">Sepia</button>
            <button class="btn-filter-chip" onclick="handleFilter('blur')">Blur</button>
          </div>
        </div>

                <div class="tool-pane" id="pane-watermark">
          <div class="mb-3">
            <label class="form-label-pro">Watermark Text</label>
            <input type="text" class="form-input-pro" id="wmText" placeholder="e.g. © YoRu">
          </div>
          <div class="row g-2 mb-3">
            <div class="col-12">
              <label class="form-label-pro">Text Color</label>
              <div class="d-flex align-items-center gap-2 mb-2">
                <button type="button" class="btn-card-icon" style="background:#ffffff; border: 2px solid #000;" onclick="setWmColor('#ffffff')"></button>
                <button type="button" class="btn-card-icon" style="background:#ffee32; border: 2px solid #000;" onclick="setWmColor('#ffee32')"></button>
                <button type="button" class="btn-card-icon" style="background:#ff6b6b; border: 2px solid #000;" onclick="setWmColor('#ff6b6b')"></button>
                <button type="button" class="btn-card-icon" style="background:#4ecdc4; border: 2px solid #000;" onclick="setWmColor('#4ecdc4')"></button>
                <button type="button" class="btn-card-icon" style="background:#000000; border: 2px solid #000;" onclick="setWmColor('#000000')"></button>
                <input type="color" class="ms-auto" id="wmColor" value="#ffffff" oninput="updateWatermarkPreview()" style="width: 36px; height: 36px; border: 2px solid #000; border-radius: 6px; cursor: pointer;">
              </div>
            </div>
            <div class="col-12">
              <label class="form-label-pro">Placement</label>
              <select class="form-input-pro" id="wmPosition">
                <option value="top-left">Top Left</option>
                <option value="top-right">Top Right</option>
                <option value="center">Center</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="bottom-right" selected>Bottom Right</option>
              </select>
            </div>
          </div>
          <button class="nb-btn nb-btn-primary w-100" onclick="handleWatermark()">
            <i class="bi bi-shield-check me-1"></i> Apply Watermark
          </button>
        </div>

                <div class="tool-pane" id="pane-export">
                    <div class="export-section">
            <div class="mb-3">
              <label class="form-label-pro">File Format</label>
              <select class="form-input-pro" id="exportFormat">
                <option value="jpg">JPG (Optimized)</option>
                <option value="png">PNG (Lossless High-Res)</option>
                <option value="webp">WEBP (Modern Web)</option>
              </select>
            </div>
            <div class="mb-4">
              <div class="d-flex justify-content-between mb-1">
                <label class="form-label-pro mb-0">Quality</label>
                <span class="canvas-live-badge" id="qualityVal">85%</span>
              </div>
              <input type="range" class="form-range form-range-pro" id="exportQuality" min="1" max="100" value="85" oninput="document.getElementById('qualityVal').textContent=this.value+'%'">
            </div>
            <button class="nb-btn w-100 btn-download" style="background-color: var(--nb-yellow);" onclick="handleExport()">
              <i class="bi bi-download me-1"></i> Download Image
            </button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div class="toast-container-custom" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
