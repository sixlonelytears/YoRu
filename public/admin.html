<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - YoRu</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Pro Studio Navbar -->
  <header class="navbar-studio">
    <div class="studio-container d-flex justify-content-between align-items-center w-100">
      <div class="d-flex align-items-center gap-3">
        <a class="brand-wrap" href="/gallery.html">
          <img src="/img/logo.png" alt="YoRu" class="brand-logo-img">
          <span class="brand-name">YoRu</span>
        </a>
        <div class="nav-divider"></div>
        <a class="nav-tab" href="/gallery.html"><i class="bi bi-grid-fill"></i> Gallery</a>
        <a class="nav-tab active" id="navAdminLink" href="/admin.html"><i class="bi bi-shield-lock-fill"></i> Admin</a>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="user-chip">
          <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
          <span class="user-chip-email" id="navUserEmail"></span>
        </div>
        <button class="nav-action-icon nav-action-danger" onclick="logout()" title="Thoát">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="studio-container py-4">
    <div class="mb-4">
      <h2 class="page-title mb-1">Admin Dashboard</h2>
      <p class="page-subtitle mb-0">Monitor studio resources and manage user accounts</p>
    </div>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card-studio p-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="text-secondary small text-uppercase fw-semibold">Users</span>
              <h3 class="text-white fw-bold mt-1 mb-0" id="statUsers">0</h3>
            </div>
            <div class="p-3 rounded-3 bg-primary bg-opacity-10 text-primary">
              <i class="bi bi-people fs-4"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-studio p-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="text-secondary small text-uppercase fw-semibold">Total Images</span>
              <h3 class="text-white fw-bold mt-1 mb-0" id="statImages">0</h3>
            </div>
            <div class="p-3 rounded-3 bg-success bg-opacity-10 text-success">
              <i class="bi bi-images fs-4"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-studio p-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="text-secondary small text-uppercase fw-semibold">Storage Used</span>
              <h3 class="text-white fw-bold mt-1 mb-0" id="statStorage">0 B</h3>
            </div>
            <div class="p-3 rounded-3 bg-warning bg-opacity-10 text-warning">
              <i class="bi bi-hdd-network fs-4"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Users Table -->
    <div class="card-studio p-3">
      <h6 class="text-white fw-bold mb-3 px-2 pt-2"><i class="bi bi-people-fill text-primary me-2"></i>Registered Accounts</h6>
      <div class="table-responsive">
        <table class="table table-dark table-hover mb-0">
          <thead>
            <tr class="text-secondary small text-uppercase">
              <th>ID</th>
              <th>Email</th>
              <th>Role</th>
              <th>Created At</th>
              <th>Images</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast-container-custom" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
